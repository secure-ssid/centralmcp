[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "centralmcp"
version = "0.7.0"
description = "Low-token HPE Networking MCP router (3 discovery/dispatch tools) over a 6,699-tool backend catalog for Aruba Central, GreenLake Platform, AOS8 migrations, Mist, ClearPass, Apstra, EdgeConnect, UXI, Axis Atmos, RAG, and OpenAPI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "ai-for-networking",
    "apstra",
    "aruba-api",
    "aruba-central",
    "aruba-central-mcp",
    "aruba-mcp",
    "arubaos8",
    "aos8-migration",
    "axis-atmos",
    "clearpass",
    "edgeconnect-acl-groups",
    "edgeconnect-bypass",
    "edgeconnect",
    "edgeconnect-interface-labels",
    "edgeconnect-link-integrity",
    "edgeconnect-services",
    "edgeconnect-zones",
    "fastmcp",
    "greenlake",
    "greenlake-mcp",
    "greenlake-platform",
    "greenlake-reporting",
    "greenlake-service-catalog",
    "hpe-aruba-uxi",
    "hpe-aruba-networking",
    "hpe-greenlake",
    "hpe-networking",
    "low-token-router",
    "mcp-server",
    "mist",
    "model-context-protocol",
    "network-automation",
    "openapi",
    "rag",
    "uxi",
    "user-experience-insight",
    "zone-based-firewall",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "mcp[cli]>=1.28.1",
    # RAG
    "httpx>=0.27.0",
    "langchain-text-splitters>=0.2.0",
    "pypdf>=6.14.2",
    "beautifulsoup4>=4.12",
    "playwright>=1.58.0",
    "redis>=8.0.1",
    "numpy>=2.2.6",
    "lancedb>=0.33.0",
    "fastembed>=0.8.0",
    "websockets>=14.0",
]

[project.scripts]
run-pipeline = "run_pipeline:main"
run-ssid = "run_ssid:main"

[project.urls]
Homepage = "https://secure-ssid.github.io/centralmcp/"
Repository = "https://github.com/secure-ssid/centralmcp"
Documentation = "https://secure-ssid.github.io/centralmcp/"
Issues = "https://github.com/secure-ssid/centralmcp/issues"
Changelog = "https://secure-ssid.github.io/centralmcp/release-notes-0.7.0.html"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["run_pipeline", "run_ssid"]

[tool.setuptools.packages.find]
include = ["pipeline*", "mcp_servers*"]

[tool.setuptools.package-data]
"mcp_servers.openapi_gen" = ["manifests/*.json", "overrides/*.json", "provenance/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
