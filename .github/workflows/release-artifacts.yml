name: Release Artifacts

# Tag-triggered (or manually dispatched) build of the deterministic
# release-artifacts bundle: validation matrix, capability/source/router
# reports, SBOM, checksums, and a provenance manifest -- followed by a
# restore/smoke-validation pass and (on tag pushes) a GitHub artifact
# attestation. This workflow never makes a live vendor API call, never
# signs/uploads anything beyond the standard actions/upload-artifact +
# actions/attest-build-provenance steps below, and never publishes a
# GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-restore-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build release-artifacts bundle
        id: build
        run: |
          uv run python scripts/build_release_bundle.py --output-dir dist
          archive=$(ls dist/centralmcp-release-artifacts-*.tar.gz)
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Restore and smoke-test bundle
        run: uv run python scripts/restore_release_bundle.py "${{ steps.build.outputs.archive }}"

      - name: Upload release-artifacts bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.checksum }}
          if-no-files-found: error
          retention-days: 90

      # actions/attest-build-provenance resolves subject-checksums entries
      # relative to the runner's working directory (repo root), while our
      # own generated .sha256 sidecar lists only the archive's basename
      # (matching scripts/package_indexes.py's existing checksum-file
      # convention). Re-write the same digest with the repo-root-relative
      # archive path so it can be fed straight into subject-checksums
      # without recomputing any hash.
      - name: Prepare attestation subject checksums
        id: attest_prep
        run: |
          digest=$(awk '{print $1}' "${{ steps.build.outputs.checksum }}")
          echo "${digest}  ${{ steps.build.outputs.archive }}" > dist/attest-subject-checksums.txt
          echo "subject_checksums=dist/attest-subject-checksums.txt" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: ${{ steps.attest_prep.outputs.subject_checksums }}
