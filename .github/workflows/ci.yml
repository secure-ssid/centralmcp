name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint (release-artifact automation modules)
        run: |
          uv run ruff check \
            pipeline/sbom.py pipeline/release_packaging.py pipeline/release_restore.py \
            scripts/run_v07_validation_matrix.py scripts/build_release_bundle.py scripts/restore_release_bundle.py \
            pipeline/artifact_contracts.py pipeline/live_test_config.py

      # --skip-rag stays: docs/release-artifact-automation.md and
      # docs/artifact-contracts.md indexes (data/docs.lance, data/specs.sqlite,
      # data/tools.lance) are git-ignored build outputs with no CI step that
      # downloads or rebuilds them, so --strict-rag/--strict-tool-index would
      # fail on every run rather than catching a real regression.
      - name: Unit tests and tool catalog gate
        run: uv run python scripts/validate_release.py --skip-rag

  api-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Check Aruba and Mist OpenAPI sources
        run: |
          uv run python scripts/check_openapi_drift.py
          uv run python scripts/check_mist_openapi_drift.py

  security-lifecycle-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check official security and lifecycle sources
        run: uv run python scripts/check_security_lifecycle_drift.py

      - name: Upload source-freshness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-freshness
          path: outputs/source-freshness.json
          if-no-files-found: warn
          retention-days: 90
